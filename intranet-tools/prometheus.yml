global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（可选）
# rule_files:
#   - /etc/prometheus/rules.yml

scrape_configs:
  # 采集 Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 采集主机资源指标（CPU、内存、磁盘、网络）
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'intranet'

  # 采集 Docker 容器指标
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 采集 DSH 容器指标（如果 DSH 在同一台服务器）
  - job_name: 'dsh'
    static_configs:
      - targets: ['host.docker.internal:3080']
    metrics_path: /metrics
